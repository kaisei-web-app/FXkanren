<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FXルール検証&シェア</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--sub:#6b7280;--line:#e5e7eb;--up:#16a34a;--down:#dc2626;--accent:#2563eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f25;--text:#eef0f3;--sub:#9aa3af;--line:#2c323b;--up:#4ade80;--down:#f87171;--accent:#60a5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f25;--text:#eef0f3;--sub:#9aa3af;--line:#2c323b;--up:#4ade80;--down:#f87171;--accent:#60a5fa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--sub)}
input,select,textarea{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{height:80px;font-size:12px;font-family:monospace}
button.main{width:100%;margin-top:12px;font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:12px;cursor:pointer}
button.main:disabled{opacity:.5}
button.ghost{font:inherit;font-size:12px;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.sub{color:var(--sub);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0}
.stats b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
canvas{width:100%;height:150px;display:block}
.verdict{border-left:4px solid var(--accent);padding:6px 10px;margin:8px 0;font-size:14px}
.post img{width:100%;border-radius:8px;display:block;margin-top:8px}
.hide{display:none}
.crow{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}.crow select,.crow input{width:auto;flex:1 1 90px}
.chk{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<main>
<h1>FXルール検証&amp;シェア</h1>
<div class="tabs"><button class="tab on" data-t="rule">ルール検証</button><button class="tab" data-t="share">みんなの投稿</button></div>

<section id="rule">
 <div class="card">
  <strong>① 価格データ</strong>
  <p class="sub">CSV(日時,始値,高値,安値,終値)を貼り付けるかファイルを選択。MT4やMT5のエクスポートも使えます。データが無い場合はサンプルで試せます。</p>
  <textarea id="csv" placeholder="2024.01.02,141.10,141.35,140.90,141.20"></textarea>
  <div class="grid" style="margin-top:8px"><input type="file" id="file" accept=".csv,.txt"><button class="ghost" id="sample">サンプルデータを作る</button></div>
  <div class="sub" id="dinfo" style="margin-top:6px"></div>
 </div>
 <div class="card">
  <strong>② エントリールール</strong>
  <div class="grid" style="margin-top:8px">
   <div><label>ルールの種類</label><select id="type"><option value="ma">移動平均線クロス</option><option value="rsi">RSIの反転</option><option value="bo">高値・安値ブレイク</option><option value="custom">自分で作る</option></select></div>
   <div><label>売買の向き</label><select id="dir"><option value="0">買いと売り</option><option value="1">買いのみ</option><option value="-1">売りのみ</option></select></div>
   <div><label id="l1">短期MA</label><input type="number" id="p1" value="20"></div>
   <div><label id="l2">長期MA</label><input type="number" id="p2" value="50"></div></div><div id="cb" class="hide" style="margin-top:10px"><label>買いの条件(すべて満たしたとき)</label><div id="rb"></div><button class="ghost" id="ab">+ 買い条件を追加</button><label style="margin-top:10px">売りの条件(すべて満たしたとき)</label><div id="rs"></div><button class="ghost" id="as">+ 売り条件を追加</button><p class="sub">「上抜け・下抜け」はその瞬間だけ反応します。「より大きい」だけだと、条件が続く間、決済のたびに再エントリーします。</p>
  </div>
 </div>
 <div class="card">
  <strong>③ 決済ルール</strong>
  <div class="grid" style="margin-top:8px">
   <div><label>損切り(pips)</label><input type="number" id="sl" value="20"></div>
   <div><label>利確(pips)</label><input type="number" id="tp" value="30"></div>
   <div><label>最大保有(本)</label><input type="number" id="mb" value="48"></div>
   <div><label>1pipの価格幅(円ペア0.01)</label><input type="number" id="pip" value="0.01" step="0.0001"></div>
   <div><label>コスト(スプレッド pips)</label><input type="number" id="cost" value="0.3" step="0.1"></div>
   <div><label>チェック基準: 最低取引回数</label><input type="number" id="chkN" value="30"></div>
   <div><label>チェック基準: 最低PF</label><input type="number" id="chkPF" value="1.2" step="0.1"></div>
   <div><label>チェック基準: 最大DD上限(pips)</label><input type="number" id="chkDD" value="200"></div>
  </div>
  <button class="main" id="run">このルールを検証する</button>
 </div>
 <div class="card hide" id="res">
  <strong>検証結果</strong>
  <div class="stats" id="stats"></div>
  <canvas id="eq"></canvas>
  <div id="checks"></div><div id="verdict"></div>
  <p class="sub">過去データで良い結果でも、将来の利益を保証するものではありません。別の期間でも成績が保てるかを確認してください。</p>
 </div>
</section>

<section id="share" class="hide">
 <div class="card">
  <strong>写真を投稿</strong>
  <label style="margin-top:8px">合言葉(友達と同じ言葉にする)</label><input id="room" maxlength="30" placeholder="例: fx-friends-2026">
  <label style="margin-top:8px">ニックネーム</label><input id="nick" maxlength="20">
  <label style="margin-top:8px">題名</label><input id="title" maxlength="60" placeholder="例: 今日のドル円の結果">
  <label style="margin-top:8px">写真</label><input type="file" id="photo" accept="image/*">
  <button class="main" id="post">投稿する</button>
  <div class="sub" id="pmsg" style="margin-top:6px"></div>
 </div>
 <div id="posts"></div>
</section>
</main>
<script src="config.js"></script>

<script>
const $=id=>document.getElementById(id);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  $("rule").classList.toggle("hide",b.dataset.t!=="rule");
  $("share").classList.toggle("hide",b.dataset.t!=="share");
});

/* ---------- ① ルール検証 ---------- */
let bars=[];
const LABELS={ma:["短期MA","長期MA",20,50],rsi:["RSI期間","買いの下限(売りは100から引いた値)",14,30],bo:["何本の高値・安値","(未使用)",20,0]};
$("type").onchange=()=>{const cu=$("type").value==="custom";$("cb").classList.toggle("hide",!cu);document.querySelectorAll("#l1,#l2,#p1,#p2").forEach(x=>x.parentElement.classList.toggle("hide",cu));if(cu)return;const L=LABELS[$("type").value];$("l1").textContent=L[0];$("l2").textContent=L[1];$("p1").value=L[2];$("p2").value=L[3]};

function parseCsv(t){
  const out=[];
  t.split(/\r?\n/).forEach(line=>{
    const c=line.split(/[,\t;]/).map(s=>s.trim());
    const n=c.map(Number);
    let o;
    if(c.length>=6&&n.slice(2,6).every(isFinite))o=n.slice(2,6);
    else if(c.length>=5&&n.slice(1,5).every(isFinite))o=n.slice(1,5);
    else if(c.length===4&&n.every(isFinite))o=n;
    if(o)out.push({o:o[0],h:o[1],l:o[2],c:o[3]});
  });
  return out;
}
function setBars(b,extra){bars=b;$("dinfo").textContent=(b.length?b.length.toLocaleString()+"本のデータを読み込みました":"読み取れるデータがありません")+(extra||"")}
$("csv").oninput=()=>setBars(parseCsv($("csv").value));
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();$("csv").value=t.slice(0,200000);setBars(parseCsv(t))};
$("sample").onclick=()=>{
  let s=1,p=150,b=[],tr=0;
  const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
  for(let i=0;i<4000;i++){
    if(i%400===0)tr=(r()-0.5)*0.03;
    const o=p;p=Math.max(1,p+tr+(r()-0.5)*0.25);
    b.push({o,h:Math.max(o,p)+r()*0.08,l:Math.min(o,p)-r()*0.08,c:p});
  }
  $("csv").value="";setBars(b,"(ランダム生成のサンプルです。本物のデータで検証してください)");
};

function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function rsi(c,n){
  const r=Array(c.length).fill(null);let g=0,l=0;
  for(let i=1;i<c.length;i++){
    const d=c[i]-c[i-1];
    if(i<=n){g+=Math.max(d,0);l+=Math.max(-d,0);if(i===n){g/=n;l/=n;r[i]=100-100/(1+g/(l||1e-9))}}
    else{g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;r[i]=100-100/(1+g/(l||1e-9))}
  }
  return r;
}
function signals(type,p1,p2){if(type==="custom")return customSignals();
  const c=bars.map(b=>b.c),s=Array(bars.length).fill(0);
  if(type==="ma"){
    const a=sma(c,p1),b=sma(c,p2);
    for(let i=1;i<c.length;i++){if(a[i-1]==null||b[i-1]==null)continue;
      if(a[i-1]<=b[i-1]&&a[i]>b[i])s[i]=1;else if(a[i-1]>=b[i-1]&&a[i]<b[i])s[i]=-1}
  }else if(type==="rsi"){
    const r=rsi(c,p1),lo=p2,hi=100-p2;
    for(let i=1;i<c.length;i++){if(r[i-1]==null)continue;
      if(r[i-1]<lo&&r[i]>=lo)s[i]=1;else if(r[i-1]>hi&&r[i]<=hi)s[i]=-1}
  }else{
    for(let i=p1;i<c.length;i++){
      let hh=-1e9,ll=1e9;for(let k=i-p1;k<i;k++){hh=Math.max(hh,bars[k].h);ll=Math.min(ll,bars[k].l)}
      if(c[i]>hh)s[i]=1;else if(c[i]<ll)s[i]=-1;
    }
  }
  return s;
}
function series(k,n){
  const c=bars.map(b=>b.c);
  if(k==="close")return c;
  if(k==="sma")return sma(c,n);
  if(k==="ema"){let e=null;const a=2/(n+1);return c.map((v,i)=>i<n-1?null:(e=e==null?c.slice(0,n).reduce((x,y)=>x+y,0)/n:e+a*(v-e)))}
  if(k==="rsi")return rsi(c,n);
  if(k==="hh")return bars.map((_,i)=>i<n?null:Math.max(...bars.slice(i-n,i).map(b=>b.h)));
  if(k==="ll")return bars.map((_,i)=>i<n?null:Math.min(...bars.slice(i-n,i).map(b=>b.l)));
  return bars.map(()=>n);
}
function readRows(id){return [...$(id).children].map(d=>({ka:d.querySelector(".ka").value,na:+d.querySelector(".na").value,op:d.querySelector(".op").value,kb:d.querySelector(".kb").value,nb:+d.querySelector(".nb").value}))}
function rowOK(r,i,A,B){const a=A[i],b=B[i];if(a==null||b==null)return false;const pa=A[i-1],pb=B[i-1];
  if(r.op===">")return a>b;if(r.op==="<")return a<b;
  if(pa==null||pb==null)return false;
  return r.op==="cu"?(pa<=pb&&a>b):(pa>=pb&&a<b)}
function customSignals(){
  const mk=id=>readRows(id).map(r=>({r,A:series(r.ka,r.na),B:series(r.kb,r.nb)}));
  const bu=mk("rb"),se=mk("rs"),s=Array(bars.length).fill(0);
  for(let i=0;i<bars.length;i++){
    const b=bu.length&&bu.every(x=>rowOK(x.r,i,x.A,x.B)),e=se.length&&se.every(x=>rowOK(x.r,i,x.A,x.B));
    if(b&&!e)s[i]=1;else if(e&&!b)s[i]=-1;
  }
  return s;
}
function backtest(){
  const type=$("type").value,p1=+$("p1").value,p2=+$("p2").value,dir=+$("dir").value;
  const sl=+$("sl").value,tp=+$("tp").value,mb=+$("mb").value,pip=+$("pip").value,cost=+$("cost").value;
  const s=signals(type,p1,p2),T=[];
  for(let i=0;i<bars.length-2;i++){
    if(!s[i]||(dir&&s[i]!==dir))continue;
    const side=s[i],e=bars[i+1].o,st=i+1;let res=null,j=st;
    for(;j<bars.length;j++){
      const b=bars[j],slp=e-side*sl*pip,tpp=e+side*tp*pip;
      const hitSL=side>0?b.l<=slp:b.h>=slp,hitTP=side>0?b.h>=tpp:b.l<=tpp;
      if(hitSL){res=-sl;break}
      if(hitTP){res=tp;break}
      if(j-st>=mb||j===bars.length-1){res=side*(b.c-e)/pip;break}
    }
    T.push(res-cost);i=j;
  }
  return T;
}
function show(T){
  $("res").classList.remove("hide");
  const n=T.length,w=T.filter(x=>x>0),l=T.filter(x=>x<=0);
  const gw=w.reduce((a,b)=>a+b,0),gl=-l.reduce((a,b)=>a+b,0);
  const tot=T.reduce((a,b)=>a+b,0),pf=gl?gw/gl:(gw?99:0),wr=n?w.length/n*100:0,ex=n?tot/n:0;
  const eq=[0];let pk=0,dd=0;T.forEach(x=>{const v=eq[eq.length-1]+x;eq.push(v);pk=Math.max(pk,v);dd=Math.max(dd,pk-v)});
  const cell=(k,v,c)=>`<div><span class="sub">${k}</span><b class="${c||""}">${v}</b></div>`;
  $("stats").innerHTML=cell("取引回数",n)+cell("勝率",wr.toFixed(1)+"%")+cell("PF",pf.toFixed(2),pf>=1?"up":"down")+
    cell("合計(pips)",tot.toFixed(1),tot>=0?"up":"down")+cell("期待値(pips/回)",ex.toFixed(2),ex>=0?"up":"down")+cell("最大DD(pips)",dd.toFixed(1));
  const v=[],sl=+$("sl").value,tp=+$("tp").value;
  if(n<30)v.push("取引回数が"+n+"回と少なく、結果が偶然の可能性が高いです。もっと長いデータで確認してください。");
  if(ex<=0)v.push("コスト込みの期待値がプラスではありません。このルールは、このデータでは優位性が確認できません。");
  else if(pf<1.2)v.push("期待値はプラスですが、PFが低く余裕がありません。条件を少し変えると崩れやすい水準です。");
  else if(n>=30)v.push("このデータでは期待値がプラスです。ただし、別の期間や別の通貨ペアでも成り立つか確認しましょう。");
  if(tp<=sl&&wr<50)v.push("利確が損切り以下で勝率も50%未満です。勝ちが小さく負けが大きい形になっています。");
  if(tot>0&&dd>tot)v.push("最大ドローダウンが合計利益より大きく、途中の含み損に耐える必要があります。");
  $("verdict").innerHTML=v.map(t=>`<div class="verdict">${t}</div>`).join("");
  const h=Math.floor(n/2),sum=a=>a.reduce((x,y)=>x+y,0),cst=+$("cost").value,mN=+$("chkN").value,mPF=+$("chkPF").value,mDD=+$("chkDD").value;
  const C=[
    ["取引回数が"+mN+"回以上",n>=mN,n+"回"],
    ["PFが"+mPF+"以上",pf>=mPF,pf.toFixed(2)],
    ["コスト込みの期待値がプラス",ex>0,ex.toFixed(2)+"pips"],
    ["最大ドローダウンが"+mDD+"pips以下",dd<=mDD,dd.toFixed(1)+"pips"],
    ["前半・後半の両方でプラス",n>=2&&sum(T.slice(0,h))>0&&sum(T.slice(h))>0,n>=2?sum(T.slice(0,h)).toFixed(0)+" / "+sum(T.slice(h)).toFixed(0):"-"],
    ["コストが2倍でも期待値がプラス",n>0&&ex-cst>0,n?(ex-cst).toFixed(2)+"pips":"-"],
    ["最大の勝ちが総利益の半分未満",gw>0&&Math.max(...T)<gw*0.5,gw>0?(Math.max(...T)/gw*100).toFixed(0)+"%":"-"]
  ];
  const ok=C.filter(x=>x[1]).length;
  $("checks").innerHTML=`<div class="sub" style="margin-top:10px">チェック項目: ${ok} / ${C.length} クリア</div>`+C.map(x=>`<div class="chk"><span>${x[1]?"✅":"❌"} ${x[0]}</span><span class="sub">${x[2]}</span></div>`).join("");
  draw(eq);
}
function draw(eq){
  const c=$("eq"),d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*d;c.height=h*d;const g=c.getContext("2d");g.scale(d,d);
  const cs=getComputedStyle(document.documentElement),mn=Math.min(...eq,0),mx=Math.max(...eq,0.001),pd=(mx-mn)*0.1||1;
  const X=i=>i/Math.max(eq.length-1,1)*w,Y=v=>h-(v-(mn-pd))/(mx-mn+2*pd)*h;
  g.strokeStyle=cs.getPropertyValue("--line");g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.stroke();
  g.strokeStyle=cs.getPropertyValue("--accent");g.lineWidth=2;g.beginPath();
  eq.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
}
const IND=[["close","終値"],["sma","単純移動平均(SMA)"],["ema","指数移動平均(EMA)"],["rsi","RSI"],["hh","直近N本の最高値"],["ll","直近N本の最安値"],["num","数値"]];
const OPS=[[">","より大きい"],["<","より小さい"],["cu","上抜け"],["cd","下抜け"]];
const opts=a=>a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
function addRow(side,ka,na,op,kb,nb){
  const d=document.createElement("div");d.className="crow";
  d.innerHTML=`<select class="ka">${opts(IND.slice(0,6))}</select><input class="na" type="number" value="20"><select class="op">${opts(OPS)}</select><select class="kb">${opts(IND)}</select><input class="nb" type="number" value="20"><button class="ghost x">×</button>`;
  if(ka){d.querySelector(".ka").value=ka;d.querySelector(".na").value=na;d.querySelector(".op").value=op;d.querySelector(".kb").value=kb;d.querySelector(".nb").value=nb}
  d.querySelector(".x").onclick=()=>d.remove();
  $(side).append(d);
}
$("ab").onclick=()=>addRow("rb");$("as").onclick=()=>addRow("rs");
addRow("rb","close",20,"cu","sma",20);addRow("rs","close",20,"cd","sma",20);
$("run").onclick=()=>{
  if(bars.length<100){alert("データが足りません。CSVを読み込むか、サンプルデータを作ってください。");return}
  show(backtest());
};

/* ---------- ② 写真シェア(Supabase) ---------- */
const CF=window.APP_CONFIG||{},U=CF.SUPABASE_URL,K=CF.SUPABASE_KEY;
const H={apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"};
const msg=t=>$("pmsg").textContent=t;
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
$("nick").value=ls.get("nick");$("room").value=ls.get("room");
async function shrink(f){
  const bm=await createImageBitmap(f);let w=900,q=0.7;
  for(let k=0;k<6;k++){
    const sc=Math.min(1,w/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
    c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    const out=c.toDataURL("image/jpeg",q);
    if(out.length<250000)return out;
    w*=0.8;q=Math.max(0.4,q-0.08);
  }
  throw new Error("big");
}
async function load(){
  const room=$("room").value.trim();
  if(!U||!K){msg("共有機能は未設定です。README.mdの手順で設定してください。");return}
  if(!room){msg("合言葉を入れると、同じ合言葉の友達の投稿が表示されます。");$("posts").innerHTML="";return}
  try{
    const r=await fetch(`${U}/rest/v1/posts?room=eq.${encodeURIComponent(room)}&order=ts.desc&limit=50`,{headers:H});
    if(!r.ok)throw 0;
    const docs=await r.json(),box=$("posts");box.innerHTML="";
    if(!docs.length){box.innerHTML='<div class="sub">まだ投稿がありません。</div>';return}
    docs.forEach(p=>{
      const el=document.createElement("div");el.className="card post";
      const h=document.createElement("strong");h.textContent=p.title||"(無題)";
      const m=document.createElement("div");m.className="sub";
      m.textContent=(p.nick||"名無し")+" ・ "+new Date(p.ts).toLocaleString("ja-JP");
      el.append(h,m);
      if(typeof p.img==="string"&&p.img.startsWith("data:image/")){const im=document.createElement("img");im.src=p.img;im.alt=p.title||"";el.append(im)}
      box.append(el);
    });
    msg("");
  }catch(e){msg("読み込めませんでした。通信と設定を確認してください。")}
}
$("post").onclick=async()=>{
  const t=$("title").value.trim(),f=$("photo").files[0],room=$("room").value.trim(),nick=$("nick").value.trim()||"名無し";
  if(!U||!K){msg("共有機能は未設定です。");return}
  if(!room||!t||!f){msg("合言葉・題名・写真を入れてください。");return}
  ls.set("nick",nick);ls.set("room",room);
  $("post").disabled=true;msg("投稿中…");
  try{
    const img=await shrink(f);
    const r=await fetch(`${U}/rest/v1/posts`,{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({room,nick,title:t,img,ts:Date.now()})});
    if(!r.ok)throw 0;
    $("title").value="";$("photo").value="";msg("投稿しました。");load();
  }catch(e){msg("投稿できませんでした。")}
  $("post").disabled=false;
};
$("room").onchange=()=>{ls.set("room",$("room").value.trim());load()};
document.querySelector('[data-t="share"]').addEventListener("click",load);
setInterval(()=>{if(!$("share").classList.contains("hide"))load()},15000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
